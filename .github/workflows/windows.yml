name: Windows Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: pwsh
        run: cmake --build build-ci --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build-ci --output-on-failure
      - name: Check sensitive material
        shell: pwsh
        run: .\scripts\check-sensitive.ps1
